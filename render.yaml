services:
  - type: web
    name: mineria-academica-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: mineria-academica-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_DATA_DIR
        value: /var/data
      - key: FRONTEND_ORIGINS
        value: https://mineriadedatos.netlify.app